
trigger:
  branches:
    include:
      - main

pool:
  name: Windows-IIS-Pool
  demands:
    - Agent.Name -equals Windows-Build-Agent-01

variables:
  buildConfiguration: 'Release'
  projectName: 'DevOpsIISStarter'
  extractedPath: '$(Build.SourcesDirectory)\extracted'
  publishPath: '$(Build.ArtifactStagingDirectory)\publish'
  reportPath: '$(Build.ArtifactStagingDirectory)\owasp-report'

steps:
# Step 1: Checkout source code
- checkout: self

# Step 2: Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

# Step 3: Extract application ZIP
- task: ExtractFiles@1
  displayName: 'Extract Project ZIP'
  inputs:
    archiveFilePatterns: '$(Build.SourcesDirectory)\DevOpsIISStarter (4).zip'
    destinationFolder: '$(extractedPath)'
    cleanDestinationFolder: true
    overwriteExistingFiles: true

# Step 4: Find the project file
- task: PowerShell@2
  displayName: 'Find .NET Project File'
  inputs:
    targetType: 'inline'
    script: |
      $root = "$(extractedPath)"

      if (-not (Test-Path $root)) {
          throw "Extraction directory not found: $root"
      }

      $projects = @(Get-ChildItem -Path $root -Recurse -Filter *.csproj -File)

      if ($projects.Count -ne 1) {
          $projects | ForEach-Object { Write-Host $_.FullName }
          throw "Expected exactly one .csproj file, found $($projects.Count)."
      }

      $project = $projects[0].FullName
      Write-Host "Project found: $project"
      Write-Host "##vso[task.setvariable variable=projectFile]$project"

# Step 5: Restore dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '$(projectFile)'

# Step 6: Build application
- task: DotNetCoreCLI@2
  displayName: 'Build Application'
  inputs:
    command: 'build'
    projects: '$(projectFile)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Step 7: Create OWASP report directory
- task: PowerShell@2
  displayName: 'Prepare OWASP Report Directory'
  inputs:
    targetType: 'inline'
    script: |
      New-Item -ItemType Directory -Path "$(reportPath)" -Force | Out-Null

# Step 8: OWASP Dependency-Check
- task: dependency-check-build-task@6
  displayName: 'OWASP Dependency-Check Scan'
  inputs:
    projectName: '$(projectName)'
    scanPath: '$(extractedPath)'
    format: 'HTML'
    uploadReports: true
    reportsDirectory: '$(reportPath)'
    failOnCVSS: '7'
    warnOnCVSSViolation: false
    enableVerbose: true

# Step 9: Publish application
- task: DotNetCoreCLI@2
  displayName: 'Publish Application'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectFile)'
    arguments: '--configuration $(buildConfiguration) --no-restore --output "$(publishPath)"'
    zipAfterPublish: false

# Step 10: Publish IIS deployment artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish IIS Deployment Artifact'
  inputs:
    targetPath: '$(publishPath)'
    artifact: 'iis-drop'
